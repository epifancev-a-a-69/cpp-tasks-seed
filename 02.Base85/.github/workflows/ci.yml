name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y g++ make cmake libgtest-dev python3
        cd /usr/src/gtest
        sudo cmake CMakeLists.txt
        sudo make
        sudo cp lib/*.a /usr/lib
    
    - name: Build release
      run: make release
    
    - name: Build debug
      run: make debug
    
    - name: Run unit tests
      run: make run_utest
    
    - name: Run integration tests
      run: make run_itest