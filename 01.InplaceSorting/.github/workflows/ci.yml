name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y g++ make clang-tidy
        # Google Test
        sudo apt install -y libgtest-dev
        cd /usr/src/gtest
        sudo cmake CMakeLists.txt
        sudo make
        sudo cp lib/*.a /usr/lib
    
    - name: Build release
      run: make release
    
    - name: Build debug
      run: make debug
    
    - name: Run unit tests
      run: make run_utest
    
    - name: Run integration tests
      run: make run_itest
    
    - name: Static analysis with clang-tidy
      run: |
        if [ -f tidy.sh ]; then
          chmod +x tidy.sh
          ./tidy.sh
        fi